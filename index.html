<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f1f7f5" />
  <meta name="robots" content="noindex, nofollow" />
  <title>WIN BIG · 锦秋基金济州岛团建相册</title>
  <link rel="icon" type="image/png" href="public/brand/jinqiu-logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="video-area video-hero" id="video-area" aria-labelledby="video-title">
    <header class="video-brand">
      <img src="public/brand/jinqiu-outing.png" alt="锦秋基金 Outing @Jeju Korea" width="720" height="430" />
    </header>
    <div class="video-hero-inner">
      <h2 id="video-title">这一次，我们赢个大的</h2>
      <div class="video-frame">
        <video id="final-video" autoplay muted playsinline controls preload="auto">
          <source src="public/videos/final-memory.mp4" type="video/mp4" />
          <p>你的浏览器不支持视频播放。</p>
        </video>
        <button class="video-play" id="video-play" type="button" aria-label="播放开场视频"><span>▶</span></button>
      </div>
    </div>
  </section>

  <main id="route-top">
    <section class="route-track" id="route-track" aria-label="沿着 WIN BIG 记忆步道浏览济州岛团队相册">
      <div class="route-stage" id="route-stage">
        <div class="sky-layer" aria-hidden="true"></div>
        <div class="route-background-line" aria-hidden="true"></div>

        <section class="activity-panel" id="activity-panel" aria-live="polite" aria-hidden="true"></section>
      </div>
    </section>
  </main>

  <footer class="route-footer">
    <div><img src="public/brand/jinqiu-logo.png" alt="锦秋基金 Jinqiu Capital" width="431" height="570" /><span>Win Big济州岛团建相册</span></div>
  </footer>

  <audio id="bgm" loop preload="none">
    <source src="public/audio/hall-of-fame.mp3?v=2" type="audio/mpeg" />
  </audio>
  <button class="bgm-toggle" id="bgm-toggle" type="button" aria-label="播放/暂停主题曲 Hall of Fame" aria-pressed="false">
    <span class="bgm-note">♫</span>
    <span class="bgm-label">WIN BIG</span>
  </button>
  <div class="bgm-tip" id="bgm-tip" role="status" hidden>
    <strong>主题曲准备好了</strong>
    <p>浏览器拦住了自动播放。点一下页面任意位置，或点右下角的 WIN BIG 就能听到。</p>
  </div>

  <dialog class="photo-dialog" id="photo-dialog" aria-labelledby="photo-dialog-title">
    <div class="photo-dialog-inner">
      <button class="photo-dialog-close" id="photo-dialog-close" type="button" aria-label="关闭完整相册">×</button>
      <h2 id="photo-dialog-title">完整相册</h2>
      <div class="photo-dialog-grid" id="photo-dialog-grid"></div>
    </div>
  </dialog>

  <dialog class="photo-lightbox" id="photo-lightbox" aria-labelledby="photo-lightbox-title">
    <div class="photo-lightbox-inner">
      <button class="photo-lightbox-close" id="photo-lightbox-close" type="button" aria-label="关闭当前照片">×</button>
      <h2 id="photo-lightbox-title">照片放大查看</h2>
      <figure class="photo-lightbox-figure">
        <img id="photo-lightbox-image" alt="" />
      </figure>
      <div class="photo-lightbox-controls">
        <button id="photo-lightbox-prev" type="button">上一张</button>
        <span id="photo-lightbox-count">1 / 1</span>
        <button id="photo-lightbox-next" type="button">下一张</button>
      </div>
      <button class="photo-lightbox-exit" id="photo-lightbox-exit" type="button">退出当前照片</button>
    </div>
  </dialog>

  <dialog class="comment-dialog" id="comment-dialog" aria-labelledby="comment-dialog-title">
    <div class="comment-dialog-inner">
      <button class="comment-dialog-close" id="comment-dialog-close" type="button" aria-label="关闭活动留言">×</button>
      <h2 id="comment-dialog-title">欢迎JQer留下你的评论</h2>
      <blockquote class="comment-source-quote">
        <p id="comment-source-text"></p>
        <cite id="comment-source-name"></cite>
      </blockquote>
      <form id="comment-form">
        <label for="comment-name">你的称呼</label>
        <input id="comment-name" name="name" type="text" maxlength="24" placeholder="怎么称呼你？" required autocomplete="off" />
        <label for="comment-text">想为这一站留下什么？</label>
        <textarea id="comment-text" name="message" rows="4" maxlength="500" required placeholder="一个没被拍下来的细节，或此刻看到照片的感受……" aria-describedby="comment-count"></textarea>
        <div class="comment-form-footer"><span id="comment-count">0 / 500</span><button type="submit">投进信箱</button></div>
        <p class="comment-storage-note">留言只保存在这台电脑上，其他同事看不到。</p>
        <p id="comment-status" class="comment-status" role="status" aria-live="polite"></p>
      </form>
      <section class="comment-list-section" aria-labelledby="comment-list-title">
        <div class="comment-list-heading"><h3 id="comment-list-title">这一站的留言 <span id="comment-total">0</span></h3></div>
        <div id="comment-list"></div>
      </section>
    </div>
  </dialog>

  <script src="activity-data.js"></script>
  <script src="scene-details.js"></script>
  <script src="script.js"></script>
</body>
</html>
